<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f4f3ef" />
    <title>Page not found | Lightmile World Map</title>
    <style>
      @font-face {
        font-family: Archivo;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/archivo-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Geist Mono';
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/geistmono-latin.woff2') format('woff2');
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        background: #f4f3ef;
        color: #0a0a0a;
        font-family: Archivo, sans-serif;
      }
      main { max-width: 34rem; }
      .eyebrow { font: 0.75rem 'Geist Mono', monospace; text-transform: uppercase; letter-spacing: 0.18em; }
      h1 { font-size: clamp(3rem, 12vw, 6rem); line-height: 0.92; margin: 1.5rem 0; }
      p { line-height: 1.5; }
      a { display: inline-block; margin-top: 1.5rem; padding: 0.9rem 1.6rem; background: #2438d6; color: #fff; text-decoration: none; }
      a:focus-visible { outline: 2px solid #2438d6; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Error 404</p>
      <h1>Off route.</h1>
      <p>This page does not exist. The link may be out of date, or the address mistyped.</p>
      <a href="/">Back to the world map</a>
    </main>
  </body>
</html>
